services:

  app:
    build: .
    container_name: news-scraper-app

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: news_scraper
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: news-scraper-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: news_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:

  postgres_data: