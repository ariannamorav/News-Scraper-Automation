<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="News Scraper - herramienta para extraer noticias de páginas web."
    >

    <title>News Scraper</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

</head>


<body>


    <!-- ==============================
         BARRA DE NAVEGACIÓN
    =============================== -->

    <nav class="navbar">

        <div class="container">

            <a
                class="brand"
                href="/"
            >

                <span class="brand-mark">
                    NS
                </span>

                <span>
                    News Scraper
                </span>

            </a>

        </div>

    </nav>



    <!-- ==============================
         CONTENIDO PRINCIPAL
    =============================== -->

    <main class="container">


        <!-- ==============================
             PANTALLA PRINCIPAL
        =============================== -->

        <section
            class="hero"
            id="searchSection"
        >


            <p class="eyebrow">
                AUTOMATIZACIÓN WEB
            </p>


            <h1>
                Convierte páginas web
                <br>
                en información útil.
            </h1>


            <p class="hero-description">

                Extrae titulares y enlaces de páginas de noticias
                automáticamente.

            </p>


            {% if error %}

            <div class="error-message">

                {{ error }}

            </div>

            {% endif %}


            <form
                class="scraper-form"
                method="POST"
                action="/analizar"
                id="scraperForm"
            >


                <label for="url">
                    URL DE LA PÁGINA
                </label>


                <div class="url-input">


                    <input
                        type="url"
                        id="url"
                        name="url"
                        placeholder="Ingresa el enlace de la página de noticias"
                        required
                    >


                    <button
                        type="submit"
                        id="analyzeButton"
                    >

                        Analizar página

                    </button>


                </div>


            </form>


        </section>



        <!-- ==============================
             PANTALLA DE CARGA
        =============================== -->

        <section
            class="loading-screen"
            id="loadingSection"
            aria-hidden="true"
        >


            <div class="loading-content">


                <p class="eyebrow">
                    ANÁLISIS EN CURSO
                </p>


                <div class="loading-title">


                    <h2>

                        Analizando
                        <br>
                        página.

                    </h2>


                    <div class="loader">

                        <div class="loader-ring"></div>

                    </div>


                </div>



                <div class="loading-status">


                    <div class="status-item active">

                        <span class="status-indicator"></span>

                        <span>
                            Conectando con el sitio
                        </span>

                    </div>


                    <div class="status-item">

                        <span class="status-indicator"></span>

                        <span>
                            Extrayendo noticias
                        </span>

                    </div>


                    <div class="status-item">

                        <span class="status-indicator"></span>

                        <span>
                            Procesando resultados
                        </span>

                    </div>


                </div>


            </div>


        </section>


    </main>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>


        const form =
            document.getElementById("scraperForm");


        const searchSection =
            document.getElementById("searchSection");


        const loadingSection =
            document.getElementById("loadingSection");


        const analyzeButton =
            document.getElementById("analyzeButton");



        /*
         * Cuando el usuario envía el formulario,
         * mostramos la pantalla de carga.
         */

        form.addEventListener("submit", function () {


            /*
             * Evitar múltiples clics mientras
             * Selenium está procesando la página.
             */

            analyzeButton.disabled = true;


            analyzeButton.textContent =
                "Analizando...";


            /*
             * Ocultar la pantalla principal.
             */

            searchSection.style.display =
                "none";


            /*
             * Mostrar la pantalla de carga.
             */

            loadingSection.classList.add("show");


            loadingSection.setAttribute(
                "aria-hidden",
                "false"
            );

        });



        /*
         * Estados del proceso.
         */

        const statusItems =
            document.querySelectorAll(".status-item");


        let currentStatus = 0;



        /*
         * Cambiar automáticamente entre
         * los diferentes estados.
         */

        setInterval(function () {


            if (
                !loadingSection.classList.contains("show")
            ) {

                return;

            }


            statusItems.forEach(function (item) {

                item.classList.remove("active");

            });


            currentStatus++;


            if (
                currentStatus >= statusItems.length
            ) {

                currentStatus = 0;

            }


            statusItems[currentStatus]
                .classList.add("active");


        }, 1800);


    </script>


</body>

</html>
